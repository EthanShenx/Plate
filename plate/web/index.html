<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plate · Figure workspace</title>
  <link rel="stylesheet" href="/plate.css">
</head>
<body>
<header class="toolbar">
  <span class="brand"><i aria-hidden="true"></i>Plate</span>
  <input id="project-name" aria-label="Project name">
  <div class="spacer"></div>
  <button id="refresh-all" title="⌘⇧Enter">Refresh all stale</button><button id="new">New</button><button id="open">Open</button><button id="save">Save</button><button id="export" class="primary">Export</button>
</header>
<main>
  <aside class="navigator"><h2>Project</h2><button id="project-folder" class="project-folder">Workspace files</button><h2>Panels</h2><div class="add-row"><select id="panel-type" aria-label="Panel type"><option value="script-py">Python</option><option value="script-r">R</option><option value="image">Image</option><option value="vector">Vector</option><option value="text">Text</option><option value="legend">Legend</option></select><button id="add">Add</button></div><div id="panel-list"></div></aside>
  <section class="stage" aria-label="Figure canvas">
    <div class="stage-bar"><span id="measure"></span><span class="spacer"></span><button id="undo">Undo</button><button id="redo">Redo</button><button id="fit-view">Fit</button><button id="actual-size">Actual size</button><button id="calibrate" aria-label="Calibrate actual size" title="Calibrate actual size">Ruler</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-in" aria-label="Zoom in">+</button></div>
    <div class="viewport"><div id="frame"></div></div>
  <section id="script-drawer" class="script-drawer" aria-label="Script editor" hidden>
      <div class="editor-bar">
        <strong id="editor-title">Script</strong><span id="editor-status"></span><span class="spacer"></span>
        <button id="dependencies">Dependencies</button><button id="reveal-script">Reveal script</button>
        <button id="save-script">Save script</button><button id="run-script" class="primary">Run</button>
      </div>
      <div id="script-editor"></div><pre id="console" class="console" aria-label="Render console"></pre>
    </section>
  </section>
  <aside class="inspector"><div class="inspector-tabs"><button id="show-inspector" aria-pressed="true">Inspector</button><button id="show-checks" aria-pressed="false">Checks</button></div><h2 id="inspector-title">Figure settings</h2><div id="settings"></div><div id="checks" hidden></div></aside>
</main>
<footer id="status" role="status"></footer>
<dialog id="save-dialog">
  <form id="save-form">
    <h2>Save project</h2>
    <label class="field">Bundle path<input id="bundle-path" required placeholder="/path/to/figure.plate"></label>
    <label class="cache-option"><input id="bundle-cache" type="checkbox"> Include rendered previews</label>
    <div class="dialog-actions"><button type="button" id="cancel-save">Cancel</button><button type="submit" class="primary">Save</button></div>
  </form>
</dialog>
<dialog id="calibration-dialog">
  <form id="calibration-form">
    <h2>Calibrate actual size</h2>
    <p>Adjust until the distance between the end marks measures 50 mm on a physical ruler.</p>
    <div class="ruler-viewport"><div id="calibration-ruler"></div></div>
    <label class="field">Ruler scale<input id="calibration-scale" type="range" min="1.5" max="12" step=".01"></label>
    <div class="dialog-actions"><button type="button" id="cancel-calibrate">Cancel</button><button type="submit" class="primary">Use this scale</button></div>
  </form>
</dialog>
<dialog id="export-dialog">
  <form id="export-form">
    <h2>Export figure</h2>
    <label class="field">Format<select id="export-format"><option value="pdf">Editable PDF</option><option value="png">PNG</option><option value="tiff">TIFF</option></select></label>
    <label class="field" id="dpi-field">Resolution<select id="export-dpi"><option>300</option><option>600</option><option>1200</option></select></label>
    <label class="field">Save to<input id="export-path" required placeholder="/path/to/figure.pdf"></label>
    <p id="export-warnings" role="status"></p>
    <div class="dialog-actions"><button type="button" id="cancel-export">Cancel</button><button type="submit" class="primary">Export</button></div>
  </form>
</dialog>
<script type="module" src="/app.js"></script>
</body>
</html>
