name: Plate tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install plotting and export dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-test.txt
          Rscript -e 'install.packages(c("ggplot2", "jsonlite", "systemfonts", "patchwork"), repos="https://cloud.r-project.org")'
          brew install librsvg
      - name: Build editor and test
        run: |
          make editor
          node --check plate/web/app.js
          make test
